name: Pages project-site

on:
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - "config/academic/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified artifact to GitHub Pages"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-project-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_BASE_PATH: /${{ github.event.repository.name }}
      ASTRO_SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check portal
        run: npm run check --workspace @calculus/portal
      - name: Test portal
        run: npm run test --workspace @calculus/portal
      - name: Build public project-site artifact
        run: npm run build:public --workspace @calculus/portal
      - name: Verify public allowlist and base-safe links
        run: npm run verify:public --workspace @calculus/portal -- "/${{ github.event.repository.name }}/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/portal/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
