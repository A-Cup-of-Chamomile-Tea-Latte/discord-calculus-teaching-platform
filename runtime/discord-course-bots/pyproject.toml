[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-course-bots"
version = "0.1.0"
description = "Tracked Discord runtime for the calculus teaching support test guild"
requires-python = ">=3.12,<3.15"
dependencies = [
  "discord.py==2.7.1",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
course-assistant = "discord_course_bots.course_assistant.bot:main"
dump-bot = "discord_course_bots.dump_bot.cli:main"
discord-bot-invites = "discord_course_bots.invites:main"
discord-db-inspect = "discord_course_bots.inspect_db:main"
discord-data-lab = "discord_course_bots.data_lab.cli_lab:main"
discord-data-bridge = "discord_course_bots.data_lab.cli_bridge:main"
discord-production-bridge = "discord_course_bots.production_bridge:main"
discord-google-oauth-bootstrap = "discord_course_bots.google_oauth_bootstrap:main"
portal-backend = "discord_course_bots.portal_backend:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
