[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-calculus-teaching-platform"
version = "0.0.0"
description = "Fixture-first tooling baseline for the calculus teaching support prototype"
requires-python = ">=3.12,<3.15"
dependencies = [
  "discord.py>=2.7.1,<3",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["bots*", "tools*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "runtime/discord-course-bots/tests"]
pythonpath = ["runtime/discord-course-bots/src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["CODEX_TASKS"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["bots", "tools", "tests"]
exclude = ["CODEX_TASKS"]
